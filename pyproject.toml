[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isyonetim"
version = "1.0.0"
description = "Yerel, tek kullanıcılı iş yönetim sistemi: proje/görev, toplantı/aksiyon ve satış takibi tek SQLite dosyasında."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Omer Faruk Gullu" }]
keywords = ["business-management", "small-business", "crm", "streamlit", "sqlite", "offline-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
    "streamlit>=1.35,<2.0",
    "pandas>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
# Masaüstü .exe paketleme (yalnızca Windows'ta anlamlı)
desktop = [
    "streamlit-desktop-app>=0.3,<1.0",
    "pillow>=10.0",
    "pyinstaller>=6.0,<7.0",
]
# Arka plan hatırlatıcı: sistem tepsisi + Windows bildirimi
tray = [
    "pystray>=0.19,<1.0",
    "pillow>=10.0",
    "winotify>=1.1,<2.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/omerfarukgullu/merchant-desk"
Repository = "https://github.com/omerfarukgullu/merchant-desk"
Issues = "https://github.com/omerfarukgullu/merchant-desk/issues"

[project.scripts]
isyonetim = "isyonetim.cli.main:app"

[tool.setuptools.packages.find]
include = ["isyonetim*"]

[tool.setuptools.package-data]
isyonetim = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # satır uzunluğu: tablo/metin blokları için esneklik
    "B008",  # typer.Option(...) varsayılanda çağrı gerektirir
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Typer komut imzalarında Optional[...] yerleşik biçim; "str | None" ile
# değiştirmek seçenek ayrıştırmasını riske atıyor.
"isyonetim/cli/*" = ["UP007", "UP045"]
